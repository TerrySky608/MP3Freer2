name: Build All Platforms (Android & Windows)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Phone / Tablet / Car)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and Build-Tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;35.0.0" "platforms;android-35"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Clean domestic cargo mirrors for CI
        run: rm -rf src-tauri/.cargo

      - name: Install npm dependencies
        run: npm ci

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android build --apk --target aarch64 armv7

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MP3Freer-Android-APK (Phone-Tablet-Car)
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  build-windows:
    name: Build Windows Desktop x64 (.exe Setup & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Clean domestic cargo mirrors for CI
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src-tauri/.cargo

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Desktop
        run: |
          npx tauri build --bundles nsis

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MP3Freer-Windows-x64-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/tauri-app.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MP3Freer-Android-APK (Phone-Tablet-Car)
          path: android-apks

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MP3Freer-Windows-x64-Setup
          path: windows-builds

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: MP3Freer Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android-apks/**/*.apk
            windows-builds/**/*.exe
