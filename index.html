<!doctype html>
<html lang="zh-CN" class="is-desktop">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mp3tao-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MP3韬" />
    <link rel="apple-touch-icon" href="/mp3tao-app-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mp3tao-app-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/mp3tao-app-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/mp3tao-app-icon.png" />
    <title>MP3韬</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0f0a1a;
        color: #f8fafc;
      }
      #boot-status {
        padding: 24px;
        font-family: sans-serif;
        font-size: 16px;
        color: #94a3b8;
      }
      #boot-error {
        display: none;
        padding: 24px;
        font-family: sans-serif;
        white-space: pre-wrap;
        word-break: break-word;
        color: #fca5a5;
        background: #0f0a1a;
        min-height: 100vh;
        box-sizing: border-box;
      }
    </style>
    <script>
      (function () {
        // 强制注销历史残留的 Service Worker 并清空 CacheStorage，确保加载最新前端资源
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function () {});
          }
        } catch (_e) {}

        var ua = navigator.userAgent || '';
        if (/Android/i.test(ua) && !/Windows/i.test(ua)) {
          document.documentElement.classList.remove('is-desktop');
          document.documentElement.classList.add('is-android');
        } else {
          document.documentElement.classList.remove('is-android');
          document.documentElement.classList.add('is-desktop');
        }
        window.__mp3freerBootError = function (msg) {
          var el = document.getElementById('boot-error');
          var st = document.getElementById('boot-status');
          if (st) st.style.display = 'none';
          if (el) {
            el.style.display = 'block';
            el.textContent = '启动失败（请截图反馈）\n\n' + msg;
          }
        };
        window.addEventListener('error', function (e) {
          var msg = (e && e.message) ? e.message : String(e);
          if (e && e.filename) msg += '\n' + e.filename + ':' + (e.lineno || '');
          window.__mp3freerBootError(msg);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          window.__mp3freerBootError(reason && reason.stack ? reason.stack : String(reason));
        });
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="boot-status">MP3Freer 正在启动…</div>
    </div>
    <div id="boot-error"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
